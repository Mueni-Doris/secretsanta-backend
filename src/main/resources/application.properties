server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:60000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:60000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:60000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:60000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:60000}

# JWT — change this to a long random string in production
jwt.secret=9f3a2c8b1d7e4f6a9c2d8e1f5a7b9c3d8e1f2a4c6b8d0e1f2a3b4c5d6e7f8a9
jwt.expiration=86400000
jwt.issuer=secretsanta-backend

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://secretsanta-livid.vercel.app}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.secretsanta=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
